name: Update project previews

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-previews-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture project previews
        run: npm run previews

      - name: Validate generated files
        run: |
          npm run previews -- --validate-config
          node -e "JSON.parse(require('fs').readFileSync('generated/project-previews/manifest.json'))"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/project-previews/
          if git diff --cached --quiet; then
            echo "No project preview changes to commit."
            exit 0
          fi
          git commit -m "chore: update project previews [skip ci]"
          git pull --rebase origin main
          git push origin "HEAD:main"
