name: Blog Post Total Counter

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count_blogs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run counter
        run: python3 fetch_total_posts.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "uxillary"
          git config --global user.email "adam@ajstudios.dev"
          git add docs/blog-total.txt docs/blog-total.csv
          git diff --cached --quiet || git commit -m "📝 Update total blog post count [skip ci]"
          git push
