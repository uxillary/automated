name: GitHub Discovery Metrics

on:
  schedule:
    - cron: '11 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-discovery-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect GitHub discovery metrics
        env:
          METRICS_GITHUB_TOKEN: ${{ secrets.METRICS_GITHUB_TOKEN }}
        run: node scripts/github_discovery_metrics.js

      - name: Validate generated files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('docs/metrics/github_discovery_history.json'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/metrics/github_discovery_summary.json'))"
          node --test tests/github_discovery_metrics.test.js tests/github_release_metrics.test.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/github_discovery_history.json docs/metrics/github_discovery_summary.json
          if git diff --cached --quiet; then
            echo "No GitHub discovery metrics changes."
            exit 0
          fi
          git commit -m "Update GitHub discovery metrics [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
